# Named humans. The ledger requires exactly one human owner per obligation, so every
# owner referenced anywhere in config/ must exist here.
#
# coverage_hours drive the SLA clock. Values marked TODO_CONFIRM are placeholders that a
# human must confirm before Phase 1; `./cb doctor` lists them. An unconfirmed coverage
# window makes every clock that touches it dishonest, so doctor fails loud, not quiet.

defaults:
  workweek: [mon, tue, wed, thu, fri]
  # Weekend and holiday work does not count toward response clocks unless a person
  # explicitly opts in below.
  holidays_calendar: us_federal

people:
