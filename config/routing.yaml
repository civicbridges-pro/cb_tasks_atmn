# Signal type -> owner rules. Starting point taken from the build brief section 7.
# Correct this with the team before Phase 1; it is a draft, not a decision.
#
# Every obligation gets exactly one primary owner. `backup` covers the primary's
# off-hours and absences. `escalates_to` is where an SLA breach goes, and it must never
# equal `backup`, or the escalation is a no-op.
#
# `match` terms classify a message. Longest matched term wins, so a specific phrase beats a
# generic one. Where two lanes legitimately share vocabulary, `prefer_when` and `avoid_when`
# break the tie on facts the message itself carries rather than on a hidden code heuristic:
# an outbound message asking for price is us chasing a vendor, while the same words inbound
# from a .mil is a solicitation. Both adjust confidence, neither forces a result, and a
# genuine tie still lands in the triage queue.

unclassified:
  primary: triage_queue
  backup: doug
  escalates_to: doug
  notes: Never guess. Low confidence and unknown type land here by design.

rules:
  - type: solicitation
    match: [solicitation, solicitations, bid decision, bid decisions, dibbs,
            sources sought, presolicitation, combined synopsis, rfq, request for quote]
    prefer_when: {counterparty_class: gov, direction: inbound}
    primary: usman
    backup: joe
    escalates_to: doug

  - type: quote_request
    # Not in the brief's matrix. A customer asking us for a price is neither a federal
    # solicitation nor a vendor quote, and it was landing in whichever lane shared a word
    # with it. Confirm the owner: see docs/open-questions.md question 9.
    match: [quote request, request a quote, requesting a quote, please quote, can you quote,
            could you quote, would you quote,
            pricing request, request for pricing, need pricing, quote for,
            availability, in stock, stock availability, do you have]
    prefer_when: {direction: inbound}
    primary: usman
    backup: joe
    escalates_to: doug

  - type: vendor_quote
    match: [vendor quote, oem quote, channel issue, letter of supply,
            authorized distributor, authorized channel, rfq, price and lead time,
            lead time, price and availability, requesting price]
    # Outbound is us asking a vendor. The same words inbound from an agency are a
    # solicitation, which is why both lanes carry a preference instead of one owning "rfq".
    prefer_when: {direction: outbound}
    avoid_when: {counterparty_class: gov}
    primary: jason
    backup: morgan
    escalates_to: doug

  - type: purchase_order
    match: [purchase order, sourcing execution, po issued, vendor po, "po#", "p.o.#",
            signed po, order acknowledgment, order ack]
    primary: joe
    backup: morgan
    escalates_to: jason

  - type: contract_action
    match: [contract, award, modification, mod, delivery order, novation]
    primary: taj
    backup: anna
    escalates_to: [doug, anna]

  - type: stop_work
    match: [stop work, stop-work, cure notice, show cause, termination]
    primary: taj
    backup: anna
    escalates_to: [doug, anna]
    # Overrides normal routing. Rare, high consequence, easy to fumble.
    page_immediately: true
    ignore_coverage_hours: true
    also_notify: [doug, anna]
    notes: >
      Primary owner works offset hours, so this signal pages the full list at once rather
      than waiting for a coverage window. Does not enter a queue.

  - type: delivery
    # Deliberately not the bare word "delivery": it appears in almost every contract email
    # and was pulling unrelated traffic into the logistics lane.
    match: [delivery order, delivery date, delivery schedule, logistics, inspection,
            shipment, shipped, packing slip, dd250, dd 250, freight, tracking number,
            first article]
    primary: roy
    backup: taj
    escalates_to: jason

  - type: invoice
    match: [invoice, ap, ar, wawf, payment, remittance, ipp]
    primary: analiza
    backup: amanda
    escalates_to: anna
    notes: >
      Brief listed backup and escalation both as Amanda. An escalation path that
      terminates at the backup is not an escalation, so escalation is set to Anna
      pending confirmation. See docs/open-questions.md.

  - type: hr_payroll
    match: [payroll, hr, insurance, benefits, workers comp, onboarding]
    primary: amanda
    backup: anna
    escalates_to: doug
    notes: >
      Brief listed backup and escalation both as Anna. Same fix as invoice, pending
      confirmation.

  - type: compliance
    match: [sam renewal, wosb, recertification, d&b, duns, state registration, cage]
    primary: anna
    backup: amanda
    escalates_to: doug

# Counterparty class can override the owner regardless of topic.
overrides:
  - when: {counterparty_class: gov}
    require_human_approval: true
    notes: Guardrail 1. No autonomous outbound to a contracting officer or agency, ever.
  - when: {counterparty_class: sled}
    sla_profile: sled
    notes: School districts and municipalities behave nothing like DLA.
